# Configuración del pipeline. Todos los valores se documentan en el README.
seed: 2026

paths:
  raw_corpus: data/raw/consolidado_limpio.xlsx     # NO se versiona; se coloca localmente con autorización de GENIAL
  raw_sheet: "Datos limpios"
  processed: data/processed/corpus_depurado.csv
  splits_dir: data/splits
  results_dir: results
  prompt: prompts/clasificador_v0.1.md

# Hash SHA-256 del archivo congelado (septiembre de 2026). El pipeline se detiene si no coincide.
corpus_sha256: f9797147e7026f796d453fa84d09c4bf32c48ae75c3744912806a72db3ff7f33

columns:
  target: Dominio
  text_parts: ["Título de la Norma", "Observaciones"]
  leakage_excluded: ["Tipo de norma", "Investigador", "Fecha de Publicación"]   # nunca son variables predictoras
  country: País
  url: URL Oficial

classes: ["Pedagógico", "Ética", "Administrativo", "Protección de Datos", "Técnico"]

split:
  test_size: 125          # entre 100 y 150; estratificado por dimensión e idioma
  fewshot_per_class: 3    # pool few-shot = 15
  min_non_spanish_test: 20

classic:
  ngram_range: [1, 2]
  max_features: 5000
  class_weight: balanced
  cv_folds: 5
  C: 1.0

llm:
  provider: anthropic                 # anthropic | gemini (el cuaderno 00 lo ajusta según la clave que encuentre)
  model: claude-sonnet-5-5            # modelo si provider = anthropic (claude-haiku-5-5 es ~20× más barato; claude-sonnet-4-5 quedó obsoleto)
  model_gemini: auto                  # si provider = gemini: «auto» elige el modelo flash de texto más reciente disponible para la clave (los nombres se retiran con el tiempo); la versión exacta queda registrada en cada ejecución
  temperature: 0.0
  repeats: 3                          # 3 ejecuciones para medir estabilidad (375 llamadas); 1 con cuotas gratuitas
  max_tokens: 40
  min_interval_s: 0                   # segundos entre llamadas; 6.5 con la cuota gratuita de Gemini (≈ 9 por minuto)

evaluation:
  bootstrap_iters: 2000
  ci_level: 0.95

routing:
  confidence_threshold: 0.50          # valor por defecto (calibrado en el Sprint 3 para el modelo base); cada modelo guardado lleva su propio umbral
  target_auto_accuracy: 0.85          # criterio de calibración del umbral por modelo: exactitud mínima del tramo automático (CV por grupo, fuera de muestra)
  min_auto_fraction: 0.10             # ... y al menos esta fracción de normas debe quedar en el tramo automático
  mandatory_review_min_country_n: 20  # países con menos normas que este umbral van siempre a revisión humana
  mandatory_review_languages: ["en", "fr", "pt"]   # pt añadido tras la auditoría de equidad (Semana 4): Brasil pasaba al tramo automático con exactitud 0.33
